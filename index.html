<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Discord Squad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="nav-logo">👾 NEON SQUAD</h1>
    </nav>

    <header class="hero">
        <h2>Cyber Basecamp Kami</h2>
        <p>Database rahasia anak-anak Discord yang sering aktif mabar.</p>
    </header>

    <main class="container">
        <section class="section-box">
            <h3 class="section-title">👑 Member Cyber Aktif</h3>
            
            <!-- 🔽 Kotak ini sengaja dikosongkan, nanti diisi otomatis oleh script.js -->
            <div id="grid-member" class="grid-member"></div>
        </section>
    </main>

    <!-- KOTAK POP-UP DETAIL PROFIL (MODAL) -->
    <div id="modal-profil" class="modal-bg">
        <div class="modal-content">
            <span class="btn-tutup" onclick="tutupProfil()">&times;</span>
            <div class="modal-header">
                <h3 id="modal-nama">Nama Member</h3>
                <p id="modal-role" class="role">Role</p>
            </div>
            <div class="modal-body">
                <p><strong>🎮 Game Favorit:</strong> <span id="modal-games">-</span></p>
                <p><strong>📝 Status/Bio:</strong> <span id="modal-bio">-</span></p>
                <p><strong>📅 Bergabung:</strong> <span id="modal-join">-</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
