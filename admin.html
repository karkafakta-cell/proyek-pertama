<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tambah Member</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="nav-logo">👾 CONTROL PANEL</h1>
        <div class="nav-links">
            <a href="index.html">← Kembali ke Web Utama</a>
        </div>
    </nav>

    <main class="container container-admin">
        <section class="section-box">
            <h3 class="section-title">📥 Tambah Member Baru</h3>
            
            <!-- Formulir Input -->
            <form id="form-member" class="card-member card-form">
                <div class="form-group">
                    <label class="form-label">Nama Discord:</label>
                    <!-- Ditambahkan oninput="cekNama()" untuk memicu gembok rahasia di JS -->
                    <input type="text" id="input-nama" class="form-input" oninput="cekNama()" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Role / Jabatan:</label>
                    <!-- Otomatis terkunci (disabled) bertuliskan Member -->
                    <input type="text" id="input-role" class="form-input" value="Member" disabled required>
                    <small style="color: #868e96; display: block; margin-top: 5px; font-size: 11px;">*Terkunci otomatis sebagai Member.</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Game Favorit:</label>
                    <!-- Input text diganti menjadi dropdown <select> cerdas -->
                    <select id="select-games" class="form-input" onchange="cekPilihanGame()" required>
                        <option value="Valorant">Valorant</option>
                        <option value="Minecraft">Minecraft</option>
                        <option value="Roblox">Roblox</option>
                        <option value="Mobile Legends">Mobile Legends</option>
                        <option value="lainnya">Dan Lainnya... (Input Sendiri)</option>
                    </select>
                </div>

                <!-- Kotak rahasia tambahan, otomatis muncul jika user memilih "Dan Lainnya..." -->
                <div class="form-group" id="box-game-lainnya" style="display: none;">
                    <label class="form-label">Ketik Game Kamu:</label>
                    <input type="text" id="input-game-manual" class="form-input" placeholder="Misal: GTA V, PB, DOTA 2">
                </div>

                <div class="form-group">
                    <label class="form-label">Status / Bio:</label>
                    <textarea id="input-bio" class="form-input form-textarea"></textarea>
                </div>
                
                <!-- CARI bagian Link Foto Profil / Seed Avatar yang lama, lalu GANTI dengan ini: -->
                <div class="form-group">
                    <label class="form-label">Foto Profil / Avatar:</label>
                    <!-- type="file" akan otomatis membuka File Explorer / Galeri HP saat diklik -->
                    <!-- accept="image/*" artinya hanya boleh memilih file gambar saja -->
                    <input type="file" id="input-avatar-file" class="form-input" accept="image/*" required style="padding: 5px;">
                </div>


                <button type="submit" class="btn-detail btn-submit">🚀 Simpan ke Database</button>
            </form>
            
            <p id="pesan-sukses" class="text-sukses">Data berhasil dikirim!</p>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
